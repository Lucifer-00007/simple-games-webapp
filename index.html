<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;">
    <title>GameHub - Collection of Interactive Web Games</title>
    <meta name="description" content="Discover and play a collection of fun, interactive web games built with HTML, CSS, and JavaScript.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>GameHub</h1>
                </div>
                <div class="header-right">
                    <div class="search-container">
                        <input type="text" id="search-bar" placeholder="Search games..." aria-label="Search games">
                    </div>
                    <div id="theme-toggle" aria-label="Toggle theme">
                        <i class="fas fa-sun" id="sun-icon"></i>
                        <i class="fas fa-moon" id="moon-icon"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="section-header">
                <h2>Featured Games</h2>
                <p>Browse our collection of interactive games</p>
            </div>
            <div id="games-container" class="games-grid"></div>
        </div>
    </main>
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <span class="logo-icon">🎮</span>
                    <h3>GameHub</h3>
                </div>
                <p class="copyright">&copy; 2025 GameHub. All rights reserved.</p>
                <div class="footer-links">
                    <a href="#" aria-label="About us">About</a>
                    <a href="#" aria-label="Contact us">Contact</a>
                    <a href="#" aria-label="Privacy Policy">Privacy</a>
                    <a href="#" aria-label="Terms of Service">Terms</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</body>
</html>
